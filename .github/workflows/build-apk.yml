
name: Build Face Swap AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "work/android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Download native libraries
        run: |
          mkdir -p "$RUNNER_TEMP/native-libs"
          curl -fL \
            "https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.0/facefusion-mobile-0.9.0-release.apk" \
            -o "$RUNNER_TEMP/upstream.apk"

          unzip -o "$RUNNER_TEMP/upstream.apk" \
            'lib/arm64-v8a/*' \
            -d "$RUNNER_TEMP/extracted"

          mkdir -p "$RUNNER_TEMP/native-libs/arm64-v8a"

          cp "$RUNNER_TEMP/extracted/lib/arm64-v8a/"* \
            "$RUNNER_TEMP/native-libs/arm64-v8a/"

      - name: Build Debug APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PprebuiltNativeDir="$RUNNER_TEMP/native-libs"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Face-Swap-AI-APK
          path: work/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
